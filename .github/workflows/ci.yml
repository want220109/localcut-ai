name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements-dev.txt -c constraints.txt
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: python -m pytest -q --junitxml=test-results/python.xml
      - run: npm test
      - run: xvfb-run -a node scripts/electron-smoke.cjs
        env:
          LOCALCUT_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: test-results/
