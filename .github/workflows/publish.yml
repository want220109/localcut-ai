name: Publish approved Windows build
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows installer workflow run ID for this tag
        required: true
      tag:
        description: Version tag (must match package.json, e.g. v0.1.0)
        required: true
      channel:
        type: choice
        options: [stable, beta]
        default: stable
      approval:
        description: Type PUBLISH to approve public release
        required: true
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: inputs.approval == 'PUBLISH'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: Validate tag and successful build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: python scripts/verify-release.py
      - uses: actions/download-artifact@v4
        with:
          name: LocalCut-AI-Windows-x64
          path: publish-artifact
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish immutable version assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            gh release create "$TAG" publish-artifact/release/* --verify-tag --prerelease --title "$TAG" --notes-file CHANGELOG.md
          else
            gh release create "$TAG" publish-artifact/release/* --verify-tag --title "$TAG" --notes-file CHANGELOG.md
          fi
