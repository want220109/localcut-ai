name: Finalize verified update draft
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful update preparation run to finalize
        required: true
  push:
    branches: [codex/finalize-update-draft]
  workflow_run:
    workflows: [Verify and prepare update draft]
    types: [completed]
permissions:
  # GitHub exposes unpublished draft assets only to tokens with contents: write.
  # Finalization verifies the draft and never edits or publishes releases.
  contents: write
  actions: write
jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify draft metadata and remove completed source transfers
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_RUN: ${{ github.event.workflow_run.id || inputs.run_id || '44045476164' }}
        run: python scripts/cleanup-source-transfer.py
