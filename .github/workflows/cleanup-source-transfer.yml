name: Remove completed temporary source transfer
on:
  workflow_run:
    workflows: [Verify and prepare update draft]
    types: [completed]
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only this run's temporary source artifact after checking the permanent draft
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSFER_RUN: ${{ github.event.workflow_run.id }}
        run: python scripts/cleanup-source-transfer.py
