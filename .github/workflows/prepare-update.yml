name: Verify and prepare update draft
on:
  workflow_run:
    workflows: [Windows installer]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful candidate Windows installer run ID
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: prepare-update-${{ github.event.workflow_run.head_sha || inputs.run_id }}
  cancel-in-progress: false
jobs:
  candidate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.provenance.outputs.sha }}
      run: ${{ steps.provenance.outputs.run }}
      version: ${{ steps.provenance.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: provenance
        name: Validate candidate provenance without running downloaded code
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python scripts/select-update-candidate.py
  upgrade:
    needs: candidate
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: LocalCut-AI-Windows-x64
          path: candidate
          run-id: ${{ needs.candidate.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: LocalCut-AI-Windows-x64
          path: previous
          run-id: '44018941776'
          github-token: ${{ github.token }}
      - name: Verify both packages and install the old version
        shell: pwsh
        run: |
          python scripts/verify-update-assets.py candidate/release '${{ needs.candidate.outputs.version }}'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate package failed verification' }
          python scripts/verify-update-assets.py previous/release 0.2.0
          if ($LASTEXITCODE -ne 0) { throw 'Previous package failed verification' }
          $old = (Resolve-Path previous/release/LocalCut-AI-0.2.0-x64-Setup.exe).Path
          if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a3f7bdb0c3ac06f501142c8b098dc53bbcc883e19fb20f8240e591ff9d1dcba8') { throw 'Previous installer provenance mismatch' }
          $installed = Start-Process $old -ArgumentList '/S' -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw 'Previous app installation failed' }
          "LOCALCUT_TEST_INSTALLED_EXE=$env:LOCALAPPDATA\Programs\LocalCut AI\LocalCut AI.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Test actual updater integrity, silent installation, restart and data preservation
        run: node scripts/test-installed-upgrade.cjs
        env:
          LOCALCUT_CANDIDATE_DIR: candidate
          LOCALCUT_CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-upgrade-results
          path: test-results/installed-upgrade/
          if-no-files-found: warn
  sources:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: LocalCut-AI-Windows-x64
          path: candidate
          run-id: ${{ needs.candidate.outputs.run }}
          github-token: ${{ github.token }}
      - name: Preserve exact build source cache and native source materials
        run: python scripts/collect-release-sources.py source-companions candidate/vendor/notices
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALCUT_CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-source-companions
          path: source-companions/
          compression-level: 0
          if-no-files-found: error
  draft:
    needs: [candidate, upgrade, sources]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.candidate.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.3
      - uses: actions/download-artifact@v4
        with:
          name: LocalCut-AI-Windows-x64
          path: candidate
          run-id: ${{ needs.candidate.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: release-source-companions
          path: source-companions
      - uses: actions/download-artifact@v4
        with:
          name: installed-upgrade-results
          path: upgrade-results
      - name: Stage an unpublished draft with verified immutable assets
        run: python scripts/stage-update-draft.py
        env:
          GH_TOKEN: ${{ github.token }}
          LOCALCUT_CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          LOCALCUT_CANDIDATE_RUN: ${{ needs.candidate.outputs.run }}
          LOCALCUT_CANDIDATE_VERSION: ${{ needs.candidate.outputs.version }}
